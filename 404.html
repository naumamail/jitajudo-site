<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jita</title>
<!-- GitHub Pages serves this file for unknown paths. jitajudo.com/c/<club>
     (the club page behind the flyer's QR code) goes to /c/?s=<club>;
     anything else goes to the start page. -->
<script>
  var m = location.pathname.match(/^\/c\/([A-Za-z0-9-]{3,40})\/?$/);
  location.replace(m ? '/c/?s=' + m[1].toLowerCase() : '/');
</script>
</head>
<body></body>
</html>
